[package]
name = "supervisor-cli"
version = "0.0.1"
edition = "2021"
description = "Dev CLI for the supervisor reconciler: spawn a roster on an in-process theater runtime and stream its decoded chain to stdout."

# Standalone crate (NOT a member of the wasm-guest workspace): this is a native
# binary linking theater-as-a-library, a separate dependency tree from supervisor/.
[workspace]

[[bin]]
name = "supervisor"
path = "src/main.rs"

[dependencies]
theater = { git = "https://github.com/colinrozzi/theater", rev = "cfcd737606758d388ab9d7042932d13e8da23a76" }
theater-stage = { git = "https://github.com/colinrozzi/theater", rev = "cfcd737606758d388ab9d7042932d13e8da23a76" }
theater-native = { git = "https://github.com/colinrozzi/theater", rev = "cfcd737606758d388ab9d7042932d13e8da23a76" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Remote control: TLS (pinned self-signed server cert) + ed25519 client auth + profiles.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
