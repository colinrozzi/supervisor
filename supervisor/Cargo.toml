[package]
name = "supervisor"
version = "0.0.1"
edition = "2021"
description = "Theater's userland supervisor: compose runtime + lifecycle into a supervision pattern (the OTP-supervisor for theater)."

[lib]
crate-type = ["cdylib", "rlib"]

# Fleet baseline (post engine-axis overhaul): packr-guest 0.24 + theater-guest.
# Pinned to theater @ 00b0bf93 for now; bump as the wave settles.
[dependencies]
packr-guest = { version = "0.24", features = ["derive"] }
packr-abi = { version = "0.24", default-features = false }
theater-guest = { git = "https://github.com/colinrozzi/theater", rev = "c3937bdc" }
