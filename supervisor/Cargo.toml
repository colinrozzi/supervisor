[package]
name = "supervisor"
version = "0.0.1"
edition = "2021"
description = "Theater's reconciler: spawn + manage a declared roster of services, reconciling reality to desired state (declarative service-manager for theater)."

[lib]
crate-type = ["cdylib"]

# Fleet baseline (post engine-axis overhaul): packr-guest 0.24 + theater-guest.
# Pinned to theater @ c197d707 (post-#206: full-chain monitor + monitor-filtered
# + handle-actor-event). Bump as the lifecycle reshape wave settles.
[dependencies]
packr-guest = { version = "0.24", features = ["derive"] }
packr-abi = { version = "0.24", default-features = false }
theater-guest = { git = "https://github.com/colinrozzi/theater", rev = "c197d707f26ad0b135f1c629e6ac7c2870aa7206" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
